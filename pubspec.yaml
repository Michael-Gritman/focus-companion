name: focus_companion
description: "Focus — software use control. Home MVP with simulated restriction state."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  cupertino_icons: ^1.0.9
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: Focus UI
      fonts:
        - asset: assets/fonts/FocusUI.ttf
